steps:
  # Build Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/notes-be-123230047',
        '.'
      ]

  # Push Docker Image ke Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'gcr.io/$PROJECT_ID/notes-be-123230047'
      ]

  # Deploy ke Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'run',
        'deploy',
        'be-123230047',
        '--image',
        'gcr.io/$PROJECT_ID/notes-be-123230047',
        '--timeout',
        '1000s',
        '--port',
        '5000',
        '--region',
        'us-central1',
        '--allow-unauthenticated'
      ]

options:
  logging: CLOUD_LOGGING_ONLY